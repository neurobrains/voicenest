name: Build and Publish to NPM

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  release:
    types: [ published ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        registry-url: 'https://registry.npmjs.org'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
          
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Run tests (if available)
      run: npm test --if-present
      
    - name: Check dist files exist
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ dist directory not found!"
          exit 1
        fi
        if [ ! -f "dist/voicenest.min.js" ]; then
          echo "❌ Main dist file not found!"
          exit 1
        fi
        echo "✅ Build artifacts verified"
        ls -la dist/
        
    - name: Publish to NPM (on release)
      if: startsWith(github.ref, 'refs/tags/v')
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        
    - name: Publish to NPM (latest from main/master)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        # Get current version from package.json
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        
        # Check if this version already exists on npm
        if npm view voicenest@$CURRENT_VERSION version 2>/dev/null; then
          echo "Version $CURRENT_VERSION already exists on npm, skipping publish"
          exit 0
        fi
        
        echo "Publishing version $CURRENT_VERSION to npm..."
        npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        
    - name: Create CDN usage comment
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "📦 Package published successfully!"
        echo ""
        echo "CDN Usage:"
        echo "🔗 jsDelivr: https://cdn.jsdelivr.net/npm/voicenest@$VERSION/dist/voicenest.min.js"
        echo "🔗 unpkg: https://unpkg.com/voicenest@$VERSION/dist/voicenest.min.js"
        echo ""
        echo "HTML Usage:"
        echo "<script src=\"https://cdn.jsdelivr.net/npm/voicenest@$VERSION/dist/voicenest.min.js\"></script>"